[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.17.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/getnodalia/toma"

[workspace.dependencies]
# internal
toma-time = { path = "crates/time" }
toma-geom = { path = "crates/geom" }
toma-color = { path = "crates/color" }
toma-bitstream = { path = "crates/bitstream" }
toma-isobmff = { path = "crates/isobmff" }
toma-avi = { path = "crates/avi" }
toma-matroska = { path = "crates/matroska" }
toma-mxf = { path = "crates/mxf" }
toma-cfb = { path = "crates/cfb" }
toma-mpegts = { path = "crates/mpegts" }
toma-mpeg2v = { path = "crates/mpeg2v" }
toma-ac3 = { path = "crates/ac3" }
toma-mpa = { path = "crates/mpa" }
toma-ogg = { path = "crates/ogg" }
toma-h264 = { path = "crates/h264" }
toma-hevc = { path = "crates/hevc" }
toma-vp8 = { path = "crates/vp8" }
toma-vp9 = { path = "crates/vp9" }
toma-prores = { path = "crates/prores" }
toma-dnx = { path = "crates/dnx" }
toma-apv = { path = "crates/apv" }
toma-dng = { path = "crates/dng" }
toma-av1 = { path = "crates/av1" }
toma-aac = { path = "crates/aac" }
toma-mp3enc = { path = "crates/mp3enc" }
toma-flac = { path = "crates/flac" }
toma-opus = { path = "crates/opus" }
toma-h264enc = { path = "crates/h264enc" }
toma-audio-dsp = { path = "crates/audio-dsp" }
toma-frame = { path = "crates/frame" }
toma-media = { path = "crates/media" }
toma-codecs = { path = "crates/codecs" }
toma-project = { path = "crates/project" }
toma-edit = { path = "crates/edit" }
toma-interchange = { path = "crates/interchange" }
toma-text = { path = "crates/text" }
toma-captions = { path = "crates/captions" }
toma-speech = { path = "crates/speech" }
toma-tts = { path = "crates/tts" }
toma-tts-text = { path = "crates/tts-text" }
toma-render = { path = "crates/render" }
toma-gpu = { path = "crates/gpu" }
toma-scopes = { path = "crates/scopes" }
toma-export = { path = "crates/export" }
toma-format = { path = "crates/format" }
toma-engine = { path = "crates/engine" }
toma-ui-egui = { path = "crates/ui-egui" }
toma-automation = { path = "crates/automation" }
toma-platform = { path = "crates/platform" }
toma-testkit = { path = "crates/testkit" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
url = "2.5.8"
log = "0.4"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
rayon = "1"
proptest = "1"
roxmltree = "0.21"
craft-docpath = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "1b34eba41e62138fc2438d2734523b302840b45d" }
craft-media = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "1b34eba41e62138fc2438d2734523b302840b45d", default-features = false }

# ui
# Shared frontend components; keep this dependency above the engine boundary.
craft-ui = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "1b34eba41e62138fc2438d2734523b302840b45d", features = ["serde", "native-windows"] }
# egui 0.37: bundled fonts are opt-in, and the monochrome symbol/emoji faces moved to their own
# feature. Toma paints ✔ ✓ ✖ ⚡ ⚠ ⚙ ♪ ☑ in panel chrome, so both features are part of the
# production font policy (system_fonts stays off).
egui = { version = "0.37", features = ["default_fonts", "monochrome_emoji_fonts"] }
# Resizable table columns (About ▸ Contributors / Models); no image loaders.
egui_extras = { version = "0.37", default-features = false }
eframe = { version = "0.37", default-features = false }
egui_kittest = "0.37"
# craft-update: app-specific pretend versions apply to startup and manual checks.
craft-update = { git = "https://github.com/storytold/craft-libs", version = "=0.1.0", rev = "1b34eba41e62138fc2438d2734523b302840b45d", features = ["egui"] }
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
needless_range_loop = "allow"
type_complexity = "allow"

# Line tables keep file and line in panics and backtraces at a fraction of full debug info's size;
# dependencies need none.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

# Codec hot loops: debug-build tests (RFC/oracle vectors) are minutes slower below opt-level 3.
[profile.dev.package.toma-h264]
opt-level = 3

[profile.dev.package.toma-h264enc]
opt-level = 3

[profile.dev.package.toma-hevc]
opt-level = 3

[profile.dev.package.toma-prores]
opt-level = 3

[profile.dev.package.toma-dnx]
opt-level = 3

[profile.dev.package.toma-apv]
opt-level = 3

[profile.dev.package.toma-dng]
opt-level = 3

[profile.dev.package.toma-av1]
opt-level = 3

[profile.dev.package.toma-aac]
opt-level = 3

[profile.dev.package.toma-mp3enc]
opt-level = 3

[profile.dev.package.toma-flac]
opt-level = 3

# Audio effects: realtime-factor tests and long convolution / spectral runs.
[profile.dev.package.toma-audio-dsp]
opt-level = 3

[profile.dev.package.toma-mxf]
opt-level = 3

[profile.dev.package.toma-opus]
opt-level = 3

[profile.dev.package.toma-vp8]
opt-level = 3

[profile.dev.package.toma-vp9]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# Keep the complete egui family and native event bridge on reviewed fork commits.
[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_extras = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_system_font_provider = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_demo_lib = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_inspection = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
