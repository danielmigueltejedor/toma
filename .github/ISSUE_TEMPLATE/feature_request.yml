name: Feature request
description: Propose a new capability or improvement for toma.
labels:
- enhancement
body:
- type: dropdown
  id: component
  attributes:
    label: Affected area
    options:
    - Timeline and editing
    - Media import and decoding
    - Color and effects
    - Audio
    - Preview and export
    - Other or unsure
  validations:
    required: true
- type: dropdown
  id: request_kind
  attributes:
    label: Type of improvement
    options:
    - New capability
    - Improve an existing workflow
    - Compatibility or interoperability
    - Accessibility
    - Other or unsure
  validations:
    required: true
- type: markdown
  attributes:
    value: |
      Please search existing issues and describe one feature per request.
      For usage questions, visit the [community chat](https://discord.gg/artcraft).
- type: textarea
  id: problem
  attributes:
    label: The problem or workflow
    description: What are you trying to accomplish, and what gets in the way?
  validations:
    required: true
- type: textarea
  id: proposal
  attributes:
    label: Requested behavior
    description: Describe how the feature would work from the user's point of view.
  validations:
    required: true
- type: textarea
  id: alternatives
  attributes:
    label: Alternatives or workarounds
    description: What have you tried, and where does it fall short?
- type: textarea
  id: context
  attributes:
    label: Additional context
    description: Optional examples, related issues, or your platform/version if relevant.
      Share only material you have permission to publish.
