name: Bug report
description: Report a reproducible problem in toma.
labels:
- bug
body:
- type: markdown
  attributes:
    value: |
      Please report one problem per issue and search existing issues first.
      For security vulnerabilities, follow [SECURITY.md](https://github.com/getnodalia/toma/security) instead of posting sensitive details here.
- type: dropdown
  id: component
  attributes:
    label: Affected area
    options:
    - Timeline and editing
    - Media import and decoding
    - Color and effects
    - Audio
    - Preview and export
    - Other or unsure
  validations:
    required: true
- type: dropdown
  id: platform
  attributes:
    label: Platform or environment
    options:
    - Linux
    - macOS
    - Windows
    - Web
    - Other or unsure
    multiple: true
  validations:
    required: true
- type: input
  id: version
  attributes:
    label: Toma version or commit
    description: Copy the version from Help > About Toma, or give the commit if built
      from source.
    placeholder: 0.8.0
  validations:
    required: true
- type: input
  id: environment
  attributes:
    label: Operating system and architecture
    placeholder: Windows 11 x64, macOS 15 Apple silicon, Ubuntu 24.04 x86_64, or browser
      and version
  validations:
    required: true
- type: dropdown
  id: build
  attributes:
    label: Installation type
    options:
    - Official installer
    - Portable archive or AppImage
    - Flatpak
    - Web app
    - Built from source
    - Other or unknown
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: Steps to reproduce
    description: Start from opening a project. Include the panel, tool, menu item,
      or command used.
    placeholder: |
      1. Open or create...
      2. Select...
      3. Observe...
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: Expected behavior
  validations:
    required: true
- type: textarea
  id: actual
  attributes:
    label: Actual behavior
    description: Include any error message and whether it happens every time.
  validations:
    required: true
- type: textarea
  id: document
  attributes:
    label: Media, sequence, export, and hardware details
    description: If relevant, include container/codec, resolution, frame rate, bit
      depth/HDR, sequence settings, export preset, GPU/driver, and hardware decoding
      or encoding settings.
- type: textarea
  id: evidence
  attributes:
    label: Screenshots, logs, or a minimal sample
    description: Optional. Remove secrets, personal paths, and private project or
      media content. Attach only files you have permission to share; do not attach
      malicious files.
- type: dropdown
  id: frequency
  attributes:
    label: How often does it happen?
    options:
    - Every time
    - Intermittently
    - Once so far
    - Unknown
  validations:
    required: true
- type: dropdown
  id: impact
  attributes:
    label: What is affected?
    options:
    - Blocked from completing the task
    - Task still possible with a workaround
    - Visual or usability issue
    - Other or unsure
  validations:
    required: true
- type: checkboxes
  id: report_checklist
  attributes:
    label: Before submitting
    options:
    - label: I searched for an existing report.
      required: true
    - label: I removed private data and credentials from the report and attachments.
      required: true
