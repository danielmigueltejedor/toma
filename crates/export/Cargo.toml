[package]
name = "toma-export"
description = "Export pipeline: parallel render → encode → mux, presets, progress/cancel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
toma-time = { workspace = true }
toma-frame = { workspace = true }
toma-color = { workspace = true }
toma-media = { workspace = true }
toma-codecs = { workspace = true }
toma-project = { workspace = true }
toma-render = { workspace = true }
toma-audio-dsp = { workspace = true }
toma-geom = { workspace = true }
toma-text = { workspace = true }
toma-isobmff = { workspace = true }
toma-prores = { workspace = true }
toma-dnx = { workspace = true }
toma-apv = { workspace = true }
toma-mxf = { workspace = true }
toma-aac = { workspace = true }
toma-mp3enc = { workspace = true }
toma-flac = { workspace = true }
toma-h264enc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
web-time = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "tiff", "bmp"] }

[dev-dependencies]
toma-testkit = { workspace = true }
