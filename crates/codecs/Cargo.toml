[package]
name = "toma-codecs"
description = "Container + codec hub: MP4/MOV, Matroska, MXF, Ogg and MPEG TS/PS sources, image sequences, GOP-aware seeking, decoder registry, audio decoding"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
toma-time = { workspace = true }
toma-color = { workspace = true }
toma-frame = { workspace = true }
toma-media = { workspace = true }
toma-avi = { workspace = true }
toma-isobmff = { workspace = true }
toma-matroska = { workspace = true }
toma-mxf = { workspace = true }
toma-mpegts = { workspace = true }
toma-mpeg2v = { workspace = true }
toma-ac3 = { workspace = true }
toma-mpa = { workspace = true }
toma-ogg = { workspace = true }
toma-bitstream = { workspace = true }
toma-h264 = { workspace = true }
toma-hevc = { workspace = true }
toma-vp8 = { workspace = true }
toma-vp9 = { workspace = true }
toma-prores = { workspace = true }
toma-dnx = { workspace = true }
toma-av1 = { workspace = true }
toma-apv = { workspace = true }
toma-aac = { workspace = true }
toma-opus = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# Decode timing counters (`gop_stats`); std's Instant panics on wasm32.
web-time = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Bootstrap audio decoding (MPL-2.0, used unmodified); replaced by own decoders over time.
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "mp1", "mp2", "mp3", "flac", "alac", "pcm", "wav", "aiff", "ogg", "vorbis", "isomp4"] }

[dev-dependencies]
toma-testkit = { workspace = true }
serde_json = { workspace = true }
