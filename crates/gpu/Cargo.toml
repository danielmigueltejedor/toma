[package]
name = "toma-gpu"
description = "wgpu compositor: YUV/RGB layer sampling, linear-light premultiplied compositing in WGSL"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
toma-color = { workspace = true }
toma-frame = { workspace = true }
toma-geom = { workspace = true }
toma-project = { workspace = true }
toma-render = { workspace = true }
toma-time = { workspace = true }
wgpu = { version = "30", default-features = false, features = ["wgsl"] }
log = { workspace = true }
pollster = "1"
rayon = { workspace = true }

[dev-dependencies]
pollster = "1"
toma-export = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
wgpu = { version = "30", features = ["wgsl", "metal", "vulkan", "dx12", "gles"] }
toma-media = { workspace = true }
toma-time = { workspace = true }
